services:
  postgres:
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-55432}:5432'
  gotest:
    image: golang:1.26
    profiles: [test]
    working_dir: /src
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/waypoint_test?sslmode=disable
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
    volumes:
      - ./api:/src
      - gotest_gomodcache:/go/pkg/mod
      - gotest_gocache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  gotest_gomodcache:
  gotest_gocache:
