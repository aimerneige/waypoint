  /api/me:
    get:
      operationId: getMe
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
