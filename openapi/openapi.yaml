              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/trips:
    post:
      operationId: "createTrip"
      parameters: []
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Trip"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TripBody"
    get:
      operationId: "listTrips"
      parameters: []
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TripList"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}:
    get:
      operationId: "getTrip"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Trip"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
    patch:
      operationId: "patchTrip"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
