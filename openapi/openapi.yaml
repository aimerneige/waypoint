openapi: 3.0.3
info:
  title: Waypoint API
  version: 0.2.0
paths:
  /api/healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Error'}
  /api/readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: OK
          content:
            application/json:
