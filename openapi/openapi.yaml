    patch:
      operationId: updateMe
      security: [{cookieAuth: []}, {bearerAuth: []}]
      description: Cookie 及未登录请求须双提交 wp_csrf Cookie 和 X-CSRF-Token；有效 Bearer 免 CSRF。
      parameters:
        - in: header
          name: X-CSRF-Token
          schema: {type: string}
      requestBody:
        required: true
        content:
