      operationId: "createInvite"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Invite"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/InviteBody"
    get:
      operationId: "listInvites"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/InviteList"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/invites/{inviteId}:
    delete:
      operationId: "revokeInvite"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "inviteId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Success"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/invites/{token}:
    get:
      operationId: "previewInvite"
      parameters:
        -
          name: "token"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/InvitePreview"
        default:
          "$ref": "#/components/responses/Error"
  /api/invites/{token}/accept:
    post:
      operationId: "acceptInvite"
      parameters:
        -
          name: "token"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Trip"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/ops:
    post:
      operationId: "pushOps"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PushResult"
        "413":
          "$ref": "#/components/responses/Error"
        "426":
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PushBody"
      description: "最多 200 条、2 MiB；逐条事务。混合批次返回逐条结果；整批版本拒绝返回 426。版本拒绝不持久化，升级后使用原 opId 重试。"
    get:
      operationId: "pullOps"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "after"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
            default: 0
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PullResult"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/snapshot:
    get:
      operationId: "getSnapshot"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/history:
    get:
      operationId: "getHistory"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "entity"
          in: "query"
          required: false
          schema:
            type: "string"
        -
          name: "entityId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        -
          name: "before"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/History"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/events:
    get:
      operationId: "tripEvents"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "text/event-stream":
              schema:
                type: "string"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
      description: "立即发送 seq；新操作后发送 seq；25 秒注释心跳。通知及心跳时重新校验会话，失效发送 unauthorized 并关闭；revoked / trip_deleted 后关闭。"
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: wp_session}
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Error:
      description: 统一错误
      headers:
        Retry-After:
          description: 限流等待秒数
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Status: {"type":"object","required":["status"],"properties":{"status":{"type":"string"}}}
    Error: {"type":"object","required":["error"],"properties":{"error":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string","description":"中文提示"}}}}}
    User: {"type":"object","required":["id","email","nickname","avatarUrl","emailVerified"],"properties":{"id":{"type":"string","format":"uuid"},"email":{"type":"string"},"nickname":{"type":"string"},"avatarUrl":{"type":"string","nullable":true},"emailVerified":{"type":"boolean"}}}
    AuthResult: {"type":"object","required":["user"],"properties":{"user":{"$ref":"#/components/schemas/User"},"token":{"type":"string"}}}
    Success: {"type":"object","required":["message"],"properties":{"message":{"type":"string"}}}
    CSRF: {"type":"object","required":["token"],"properties":{"token":{"type":"string"}}}
