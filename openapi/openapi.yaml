            schema: {$ref: '#/components/schemas/UpdateMeBody'}
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: wp_session}
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Error:
      description: 统一错误
      headers:
        Retry-After:
          description: 限流等待秒数
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Status: {"type":"object","required":["status"],"properties":{"status":{"type":"string"}}}
    Error: {"type":"object","required":["error"],"properties":{"error":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string","description":"中文提示"}}}}}
    User: {"type":"object","required":["id","email","nickname","avatarUrl","emailVerified"],"properties":{"id":{"type":"string","format":"uuid"},"email":{"type":"string"},"nickname":{"type":"string"},"avatarUrl":{"type":"string","nullable":true},"emailVerified":{"type":"boolean"}}}
    AuthResult: {"type":"object","required":["user"],"properties":{"user":{"$ref":"#/components/schemas/User"},"token":{"type":"string"}}}
    Success: {"type":"object","required":["message"],"properties":{"message":{"type":"string"}}}
    CSRF: {"type":"object","required":["token"],"properties":{"token":{"type":"string"}}}
    RegisterBody: {"type":"object","additionalProperties":false,"required":["email","password","nickname"],"properties":{"email":{"type":"string"},"password":{"type":"string","minLength":8,"maxLength":1024},"nickname":{"type":"string","minLength":1,"maxLength":100},"tokenDelivery":{"type":"string","enum":["cookie","bearer"],"default":"cookie"}}}
    LoginBody: {"type":"object","additionalProperties":false,"required":["email","password"],"properties":{"email":{"type":"string"},"password":{"type":"string"},"tokenDelivery":{"type":"string","enum":["cookie","bearer"],"default":"cookie"}}}
    VerifyEmailBody: {"type":"object","additionalProperties":false,"required":["token"],"properties":{"token":{"type":"string"}}}
    ForgotPasswordBody: {"type":"object","additionalProperties":false,"required":["email"],"properties":{"email":{"type":"string"}}}
    ResetPasswordBody: {"type":"object","additionalProperties":false,"required":["token","newPassword"],"properties":{"token":{"type":"string"},"newPassword":{"type":"string","minLength":8,"maxLength":1024}}}
    ChangePasswordBody: {"type":"object","additionalProperties":false,"required":["oldPassword","newPassword"],"properties":{"oldPassword":{"type":"string"},"newPassword":{"type":"string","minLength":8,"maxLength":1024}}}
    UpdateMeBody: {"type":"object","additionalProperties":false,"required":[],"properties":{"nickname":{"type":"string","minLength":1,"maxLength":100},"avatarUrl":{"type":"string","nullable":true,"maxLength":2048}}}
