openapi: 3.0.3
info:
  title: Waypoint API
  version: 0.2.0
paths:
  /api/healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Error'}
  /api/readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/csrf:
    get:
      operationId: getCSRF
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CSRF'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/register:
    post:
      operationId: register
      description: Cookie 及未登录请求须双提交 wp_csrf Cookie 和 X-CSRF-Token；有效 Bearer 免 CSRF。
      parameters:
        - in: header
          name: X-CSRF-Token
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterBody'}
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/login:
    post:
