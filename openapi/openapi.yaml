          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginBody'}
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
