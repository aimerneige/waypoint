      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TripPatch"
    delete:
      operationId: "deleteTrip"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Success"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/transfer-owner:
    post:
      operationId: "transferOwner"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Success"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TransferBody"
  /api/trips/{tripId}/members/{userId}:
    delete:
      operationId: "removeMember"
      parameters:
        -
          name: "tripId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Success"
        default:
          "$ref": "#/components/responses/Error"
      security:
        -
          cookieAuth: []
        -
          bearerAuth: []
  /api/trips/{tripId}/leave:
